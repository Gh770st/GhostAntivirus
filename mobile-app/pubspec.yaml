name: ghost_antivirus_mobile
description: GhostAntivirus Mobile - Next-generation mobile security application
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI Framework
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^7.0.7296
  
  # State Management
  provider: ^6.0.5
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Security & Encryption
  crypto: ^3.0.3
  encrypt: ^5.0.1
  flutter_secure_storage: ^8.0.0
  
  # Permissions & Device Info
  permission_handler: ^11.0.1
  device_info_plus: ^9.1.0
  battery_plus: ^5.0.2
  network_info_plus: ^5.0.1
  
  # File System
  path: ^1.8.3
  file_picker: ^6.1.1
  
  # Background Services
  android_intent_plus: ^4.0.3
  flutter_background_service: ^5.0.1
  
  # UI Components
  fl_chart: ^0.64.0
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Biometrics
  local_auth: ^2.1.6
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  
  # Location
  geolocator: ^10.1.0
  
  # VPN (Platform specific)
  openvpn_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/config/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#1a1a1a"
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo_android12.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive.png"